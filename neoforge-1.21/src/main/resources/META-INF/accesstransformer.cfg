# Colored block model face bakery
#! DELETE(slimeknights.mantle.client.model.util.ColoredBlockModel): the whole section is gone. ColoredBlockModel no
#! longer reimplements FaceBakery#bakeQuad, so setupShape, makeVertices and recalculateWinding have no consumer, and
#! BlockModel#FACE_BAKERY (still private) is replaced by an instance of the stateless, publicly constructible
#! FaceBakery -- what NeoForge's own UnbakedGeometryHelper keeps. 1.21 moved the UV lock onto ModelState
#! (ColoredBlockModel.UvLockedState supplies it) and taught the real bakeQuad to apply a face's own neoforge_data,
#! leaving only the emissivity override for Mantle to apply on top of the vanilla call.

