/*
 * Mantle - version-agnostic layout exploration.
 *
 * The root project builds nothing. Everything lives in the two target modules,
 * because the two toolchains (ForgeGradle 6 / ModDevGradle) cannot be applied
 * to the same project and disagree about Java version, mappings source and
 * Minecraft dependency resolution.
 */

plugins {
    id 'base'
}

group = 'slimeknights.mantle'

// `gradlew build` at the root fans out to both targets.
tasks.named('build') {
    dependsOn ':forge-1.20:build', ':neoforge-1.21:build'
}

tasks.register('printSharedSources') {
    description = 'Lists the source files compiled into both targets.'
    doLast {
        def dir = file('common/src/main/java')
        def files = fileTree(dir).matching { include '**/*.java' }.files.sort()
        println "common/src/main/java: ${files.size()} shared source files"
        files.each { println "  ${dir.toPath().relativize(it.toPath())}" }
    }
}
