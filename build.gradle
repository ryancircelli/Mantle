/*
 * Mantle
 * Master build file
 * Based on TConstruct's master build file
 * Authors: Sunstrike, ProgWML6
 * Help from AbrarSyed
*/

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle replaces ForgeGradle 6 + Librarian for the 1.21.1 / NeoForge port.
    id 'net.neoforged.moddev' version '2.0.143'
    id 'io.freefair.lombok' version '8.14.4'
}

repositories {
    mavenCentral()
    maven {
        // Our maven
        name = "Prog's Maven"
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        // Parchment; also mirrored on the NeoForged maven that ModDevGradle adds itself,
        // declared here so the mappings source is obvious from the build script.
        name = "ParchmentMC"
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // JEI
        name = "BlameJared"
        url = 'https://maven.blamejared.com'
    }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
}

group = 'slimeknights.mantle'
base {
    archivesName = 'Mantle'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${system.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

/*
 * ---------------------------------------------------------------------------
 * Porting frontier
 * ---------------------------------------------------------------------------
 * porting/unported.txt and porting/unported-test.txt are the ledger of source
 * files that have not been ported to 1.21.1 yet. Everything listed is kept out
 * of its source set, so the build compiles only what has actually crossed over.
 *
 * The ledger is self-liquidating: a port PR deletes lines from it, never adds
 * them, and the last PR of the port deletes the files outright. checkPortingFrontier
 * below is what makes that a rule rather than an intention.
 */
ext.frontiers = [
        [name: 'main', ledger: file('porting/unported.txt'), root: 'src/main/java'],
        [name: 'test', ledger: file('porting/unported-test.txt'), root: 'src/test/java'],
]

// Reads a ledger into repo-relative paths, dropping blank lines and # comments.
ext.readFrontier = { File ledger ->
    if (!ledger.exists()) {
        return [] as List<String>
    }
    return ledger.readLines('UTF-8')
            *.trim()
            .findAll { !it.isEmpty() && !it.startsWith('#') }
}

sourceSets {
    main {
        java {
            // Ant-style excludes are relative to the source directory, so drop the root prefix.
            readFrontier(frontiers[0].ledger).each { exclude it.substring(frontiers[0].root.length() + 1) }
        }
        resources {
            srcDirs "src/generated/resources"
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
        }
    }
    test {
        java {
            readFrontier(frontiers[1].ledger).each { exclude it.substring(frontiers[1].root.length() + 1) }
        }
    }
}

/*
 * Guards the frontier on every `check`:
 *
 *  (a) every path in a ledger must exist, so a file cannot be renamed or deleted
 *      out from under the ledger and leave a stale line behind; and
 *  (b) a ledger may only shrink. The baseline is the committed copy at HEAD~,
 *      read with `git show HEAD~:<path>` — so on a branch each commit is checked
 *      against its parent, and CI checking out a PR head sees the same thing.
 *      Any entry present now but absent from the baseline fails the build: that
 *      is a file being pushed back behind the frontier instead of ported.
 *
 * If HEAD~ has no copy of the ledger (the commit that introduces it, or a shallow
 * clone with no parent) there is no baseline and the shrink check is skipped; the
 * existence check still runs.
 */
tasks.register('checkPortingFrontier') {
    group = 'verification'
    description = 'Verifies the porting frontier is intact and has not grown since HEAD~.'

    def projectDirectory = projectDir
    def ledgers = frontiers.collect { [name: it.name, path: rootDir.toPath().relativize(it.ledger.toPath()).toString(), file: it.ledger] }
    def read = readFrontier
    inputs.files(frontiers*.ledger).withPropertyName('ledgers')

    doLast {
        // Reads the committed copy of a ledger at HEAD~; null when there is no baseline.
        def baselineOf = { String path ->
            def out = new ByteArrayOutputStream()
            def proc = new ProcessBuilder('git', 'show', "HEAD~:${path}".toString())
                    .directory(projectDirectory)
                    .redirectErrorStream(false)
                    .start()
            proc.inputStream.transferTo(out)
            proc.errorStream.transferTo(OutputStream.nullOutputStream())
            return proc.waitFor() == 0 ? out.toString('UTF-8') : null
        }

        def failures = []
        ledgers.each { ledger ->
            def entries = read(ledger.file)

            def duplicates = entries.countBy { it }.findAll { it.value > 1 }.keySet()
            if (!duplicates.isEmpty()) {
                failures << "${ledger.path} lists ${duplicates.size()} path(s) more than once:\n  ${duplicates.join('\n  ')}"
            }

            def missing = entries.findAll { !new File(projectDirectory, it).exists() }
            if (!missing.isEmpty()) {
                failures << "${ledger.path} lists ${missing.size()} path(s) that do not exist. Delete the line if the file was ported or removed:\n  ${missing.join('\n  ')}"
            }

            def baselineText = baselineOf(ledger.path)
            if (baselineText == null) {
                logger.lifecycle("porting frontier [${ledger.name}]: ${entries.size()} unported file(s); no copy at HEAD~, shrink check skipped")
                return
            }
            def baseline = baselineText.readLines()*.trim().findAll { !it.isEmpty() && !it.startsWith('#') } as Set
            def added = entries.findAll { !baseline.contains(it) }
            if (!added.isEmpty()) {
                failures << "${ledger.path} grew by ${added.size()} entr(y/ies) since HEAD~. The porting frontier only shrinks:\n  ${added.join('\n  ')}"
            }
            def ported = baseline.size() - entries.size()
            logger.lifecycle("porting frontier [${ledger.name}]: ${entries.size()} unported file(s), ${ported >= 0 ? ported : 0} ported since HEAD~")
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Porting frontier check failed:\n\n${failures.join('\n\n')}\n")
        }
    }
}

tasks.named('check').configure {
    dependsOn 'checkPortingFrontier'
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = project.parchment_version
    }

    // The shipped access transformer is now Mojang-named end to end (translated in M2), so
    // ModDevGradle's convention of picking up src/main/resources/META-INF/accesstransformer.cfg
    // is left alone. validateAccessTransformers fails the build if any line stops resolving,
    // which is the safety net M2 wants and keeps the file honest for the rest of the port.
    validateAccessTransformers = true

    mods {
        mantle {
            sourceSet sourceSets.main
        }
    }

    runs {
        // applies to all the run configs below
        configureEach {
            gameDirectory = project.file('run')
            // Recommended logging level for the console.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', 'mantle',
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }

        gameTestServer {
            type = 'gameTestServer'
        }
    }

    // Puts a loaded Minecraft on the test classpath and bootstraps FML around JUnit, which is what lets the
    // serialization tests call Bootstrap.bootStrap() and reach the real registries. testedMod is the mod whose
    // classes the tests belong to, so the test source set is loaded as part of it rather than as a separate mod.
    unitTest {
        enable()
        testedMod = mods.mantle
    }
}

dependencies {
    // Minecraft and NeoForge come from the neoForge block above, not from a dependency line.
    // JEI: compile against the API only (both halves - the plugin interfaces are common, the
    // registration/rendering interfaces this module actually implements are neoforge-specific),
    // and pull the runnable mod jar in only for local testing via the client run.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
    // forward the junit switches to the test JVM, notably junit.jupiter.conditions.deactivate to run a disabled benchmark on demand
    System.properties.each { key, value ->
        if (key.toString().startsWith('junit.')) {
            systemProperty key.toString(), value
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range': neoforge_range
    ]
    inputs.properties replaceProperties

    // No `project` in the binding: neither template references it, and reaching for
    // Task.project at execution time is deprecated and configuration-cache hostile.
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Mantle",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
