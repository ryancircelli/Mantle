/*
 * Mantle - Forge 1.20.1 target.
 *
 * Compiles common/src/main/java together with this module's own sources against
 * Forge 1.20.1 on a Java 17 toolchain. The shared source is added as an extra
 * srcDir rather than consumed as a project dependency: there is no common jar,
 * because a class compiled against 1.20.1's Minecraft cannot link against
 * 1.21.1's.
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.0.37]'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'io.freefair.lombok' version '8.14.4'
}

repositories {
    mavenCentral()
    maven {
        name = "Prog's Maven"
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'yarn2mcp'
        url = 'https://maven.tterrag.com/'
    }
}

group = 'slimeknights.mantle'
base {
    archivesName = 'Mantle'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

ext.minecraft_version = project.forge_minecraft_version

version = "${minecraft_version}-${mod_version}"
println "forge-1.20: Java toolchain 17, Minecraft ${minecraft_version}, Forge ${forge_version}"

sourceSets {
    main {
        java {
            // The shared half of the codebase.
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            srcDirs += "src/generated/resources"
            exclude '.cache'
        }
    }
}

minecraft {
    mappings channel: 'parchment', version: "${forge_parchment_version}-${minecraft_version}"

    enableIdeaPrepareRuns = true
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
            property 'forge.logging.console.level', 'debug'
            mods {
                mantle {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
        data {
            args '--mod', 'mantle', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${forge_jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${forge_jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${forge_jei_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
    System.properties.each { key, value ->
        if (key.toString().startsWith('junit.')) {
            systemProperty key.toString(), value
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version': project.version,
        'loader_range': forge_loader_range,
        'minecraft_range': forge_minecraft_range,
        'forge_range': forge_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Mantle",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
