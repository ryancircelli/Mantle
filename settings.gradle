/*
 * Mantle - version-agnostic layout exploration.
 *
 * The build is one Gradle project per target toolchain. Each target owns its
 * loader plugin, its Minecraft version and its Java toolchain; neither knows
 * anything about the other. `common/` is not a project: it is a source
 * directory both targets add to their own main source set, so the shared code
 * is compiled once per target against that target's Minecraft.
 *
 * A shared *artifact* is not possible - Minecraft is not binary compatible
 * across 1.20.1 and 1.21.1, so a single common jar could not link against
 * both. Shared *source*, compiled twice, is the strongest form available.
 */

pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle 6 (the 1.20.1 target)
        maven { url = 'https://maven.minecraftforge.net/' }
        // ModDevGradle (the 1.21.1 target)
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Mantle'

include 'forge-1.20'
include 'neoforge-1.21'
