#! REWORK(slimeknights.mantle.client.ClientEvents): Gui#GUI_ICONS_LOCATION is gone entirely. The single legacy icon sheet was replaced by per-element sprite ResourceLocations (e.g. CROSSHAIR_ATTACK_INDICATOR_*_SPRITE, HOTBAR_OFFHAND_*_SPRITE), all private, drawn via GuiGraphics#blitSprite. ClientEvents.renderCooldown() blits raw pixel rects out of the old sheet for the attack-indicator and offhand-cooldown overlays; it needs its own sprite/texture and blitSprite calls when it ports.
