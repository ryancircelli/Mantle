# Inverted fluid
# FlowingFluid#isWaterHole and #canPassThrough are deliberately not widened here. Lithium's
# FlowingFluidMixin replaces both with *private* overwrites, and mixin refuses a private overwrite of a target another
# mod has widened to protected, so those two lines killed the dedicated server at boot with a MixinApplyError.
# InvertedFluid carries its own private copies instead (isCeilingHole and canFluidPassThrough), called from the entry
# points it already overrides, which also frees it from relying on either member staying virtual. The seven lines
# below are unaffected: lithium shadows those members rather than overwriting them.
protected net.minecraft.world.level.material.FlowingFluid sourceNeighborCount(Lnet/minecraft/world/level/LevelReader;Lnet/minecraft/core/BlockPos;)I # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid spreadToSides(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/material/FluidState;Lnet/minecraft/world/level/block/state/BlockState;)V # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid canPassThroughWall(Lnet/minecraft/core/Direction;Lnet/minecraft/world/level/BlockGetter;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;)Z # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid canHoldFluid(Lnet/minecraft/world/level/BlockGetter;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/material/Fluid;)Z # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid isSourceBlockOfThisType(Lnet/minecraft/world/level/material/FluidState;)Z # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid affectsFlow(Lnet/minecraft/world/level/material/FluidState;)Z # used by slimeknights.mantle.fluid.InvertedFluid
protected net.minecraft.world.level.material.FlowingFluid getCacheKey(Lnet/minecraft/core/BlockPos;Lnet/minecraft/core/BlockPos;)S # used by slimeknights.mantle.fluid.InvertedFluid

