# Build reuse with advancements
#! REWORK(slimeknights.mantle.recipe.data.AbstractRecipeBuilder): Advancement$Builder#criteria is now `private final ImmutableMap.Builder<String, Criterion<?>> criteria`, was a mutable Map. AbstractRecipeBuilder.save() does `advancementBuilder.criteria.put("has_the_recipe", ...)` to overwrite an existing key, which ImmutableMap.Builder cannot do. Needs its own criteria map (or addCriterion(String, Criterion<?>), now public, if overwrite semantics are dropped) when AbstractRecipeBuilder ports.
#! public net.minecraft.advancements.Advancement$Builder criteria

