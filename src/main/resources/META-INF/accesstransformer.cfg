# Loot table injections
#! REWORK(slimeknights.mantle.loot.LootTableInjection): LootPool#entries changed type from LootPoolEntryContainer[] to List<LootPoolEntryContainer>. LootTableInjection.inject() does `pool.entries.length` / `Arrays.copyOf(pool.entries, ...)` / `System.arraycopy(...)`, all array-only operations that do not compile against a List. Needs a List-based rebuild (e.g. new ArrayList<>(pool.entries) then addAll) when it ports.
#! public-f net.minecraft.world.level.storage.loot.LootPool entries

# Work around mods writing mixins into vanilla getters that perform very unsafe and expensive operations, might as well make it only their problem
#! REWORK(slimeknights.mantle.item.EdibleItem): Item#foodProperties is gone entirely. Food is now a per-ItemStack data component (DataComponents.FOOD / Item.Properties#food(FoodProperties)), not a field on Item. EdibleItem's constructor-time `Objects.requireNonNull(foodProperties, ...)` check needs to read the component off the built properties/stack instead.
#! protected net.minecraft.world.item.Item foodProperties

