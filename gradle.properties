# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=1.11

# Minecraft Version Information
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
neoforge_version=21.1.248
neoforge_range=[21.1.0,)
# javafml loader version, 4 across the 1.21 line
loader_range=[4,)

# Parchment mappings; ModDevGradle wants the Minecraft version and the mappings
# release separately, unlike Librarian which took a single combined string.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# Build dependencies
# JEI is not published for 1.21.1 in a shape this build can consume yet, and no
# source that touches it has been ported. The dependency returns in M12.
