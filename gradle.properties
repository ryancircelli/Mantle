# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=1.11

# Gradle only reads the root gradle.properties, so the per-target settings are
# namespaced rather than split into one properties file per module.

# --- forge-1.20 target ---
forge_minecraft_version=1.20.1
forge_minecraft_range=[1.20.1,1.20.2)
forge_version=47.2.0
forge_range=*
forge_loader_range=*
forge_parchment_version=2023.09.03
forge_jei_version=15.3.+

# --- neoforge-1.21 target ---
neoforge_minecraft_version=1.21.1
neoforge_minecraft_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
neoforge_range=[21.1.0,)
# javafml loader version, 4 across the 1.21 line
neoforge_loader_range=[4,)
neoforge_parchment_minecraft_version=1.21.1
neoforge_parchment_version=2024.11.17
neoforge_jei_version=19.44.0.401
